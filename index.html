
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Memories Gallery</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:white;font-family:Arial,sans-serif}
.hero{min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}
.cover{width:min(900px,100%);padding:0;border:0;border-radius:22px;overflow:hidden;position:relative;cursor:pointer;background:#222}
.cover img{width:100%;height:min(65vh,520px);object-fit:cover;display:block}
.cover-label{position:absolute;bottom:0;left:0;width:100%;padding:45px 20px 20px;text-align:left;background:linear-gradient(transparent,#000d)}
h1{font-size:35px;margin:0 0 10px}
.gallery{display:none;max-width:1100px;margin:auto;padding:25px 15px}
.gallery.show{display:block}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:20px}
button{cursor:pointer}
.back,.action{padding:11px 17px;border-radius:10px;border:0;background:#293b59;color:white}
.action{background:#d63384;margin:15px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.tile{background:#222938;color:white;border:0;border-radius:14px;overflow:hidden;padding:0;text-align:left}
.tile img{width:100%;height:220px;object-fit:cover;display:block}
.tile span{display:block;padding:12px}
.viewer{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:15px}
.viewer.show{display:flex}
.viewer-inner{width:min(1000px,100%)}
.viewer img,.viewer video{max-width:100%;max-height:80vh;display:block;margin:auto}
.close{display:block;margin:0 0 12px auto;padding:10px 18px;border:0;border-radius:20px}
#videos{display:none;padding:20px;text-align:center}
#videos video{width:100%;max-width:600px}
@media(max-width:600px){h1{font-size:27px}.tile img{height:180px}}
</style>
</head>
<body>

<section class="hero" id="home">
<div>
<button class="cover" onclick="openGallery()">
<img src="images/Screenshot_20261103_122849.jpg" alt="Main cover">
<div class="cover-label">
<h1>❤️ My Memories</h1>
<p>Click here to explore more photos and videos</p>
</div>
</button>
<p>Tap the picture to open your gallery ↓</p>
</div>
</section>

<section class="gallery" id="gallery">
<div class="topbar">
<div>
<h2>My Photo Gallery 📸</h2>
<p>Click any photo to view full screen</p>
</div>
<button class="back" onclick="goHome()">← Back</button>
</div>

<div class="grid">

<button class="tile" onclick="showImage('images/images%20(3).jpg')">
<img src="images/images%20(3).jpg" alt="Photo 1">
<span>Photo 1 ❤️</span>
</button>

<button class="tile" onclick="showImage('images/images%20(4).jpg')">
<img src="images/images%20(4).jpg" alt="Photo 2">
<span>Photo 2 ❤️</span>
</button>

<button class="tile" onclick="showImage('images/images%20(5).jpg')">
<img src="images/images%20(5).jpg" alt="Photo 3">
<span>Photo 3 ❤️</span>
</button>

<button class="tile" onclick="showImage('images/images%20(6).jpg')">
<img src="images/images%20(6).jpg" alt="Photo 4">
<span>Photo 4 ❤️</span>
</button>

<button class="tile" onclick="showImage('images/images%20(7).jpg')">
<img src="images/images%20(7).jpg" alt="Photo 5">
<span>Photo 5 ❤️</span>
</button>

</div>

<div style="text-align:center">
<button class="action" onclick="showVideos()">🎬 View Videos</button>
</div>

<div id="videos">
<h2>My Videos 🎬</h2>
<p>Upload your videos into a videos folder and add their filenames here.</p>
<button class="back" onclick="hideVideos()">← Back to Photos</button>
</div>
</section>

<div class="viewer" id="viewer" onclick="closeViewer(event)">
<div class="viewer-inner">
<button class="close" onclick="closeViewer()">✕ Close</button>
<div id="viewerContent"></div>
</div>
</div>

<script>
function openGallery(){
document.getElementById('home').style.display='none';
document.getElementById('gallery').classList.add('show');
window.scrollTo(0,0);
}

function goHome(){
document.getElementById('gallery').classList.remove('show');
document.getElementById('home').style.display='grid';
document.getElementById('videos').style.display='none';
window.scrollTo(0,0);
}

function showImage(src){
document.getElementById('viewerContent').innerHTML='';
const img=document.createElement('img');
img.src=src;
img.alt='Selected photo';
document.getElementById('viewerContent').appendChild(img);
document.getElementById('viewer').classList.add('show');
}

function showVideos(){
document.getElementById('videos').style.display='block';
document.querySelector('.grid').style.display='none';
}

function hideVideos(){
document.getElementById('videos').style.display='none';
document.querySelector('.grid').style.display='grid';
}

function closeViewer(event){
if(event && event.target!==document.getElementById('viewer'))return;
document.getElementById('viewer').classList.remove('show');
document.getElementById('viewerContent').innerHTML='';
}
</script>

</body>
</html>
