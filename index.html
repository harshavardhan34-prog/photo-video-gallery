
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo & Video Gallery</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #10131b;
  color: white;
}

/* FULL SCREEN COVER */
.hero {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  padding: 0;
  margin: 0;
  display: grid;
  place-items: center;
}

.cover {
  width: 100%;
  height: 100%;
  border: 0;
  border-radius: 0;
  padding: 0;
  overflow: hidden;
  position: relative;
  background: #000;
  cursor: pointer;
}

.cover img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}

.cover-label {
  position: absolute;
  inset: auto 0 0;
  padding: 70px 22px 35px;
  text-align: left;
  background: linear-gradient(transparent, #000e);
}

.cover-label h1 {
  margin: 0 0 10px;
  font-size: 34px;
}

.cover-label p {
  margin: 0;
  color: #ddd;
  font-size: 16px;
}

/* GALLERY */
.gallery {
  display: none;
  padding: 25px 18px 50px;
  max-width: 1100px;
  margin: auto;
}

.gallery.show {
  display: block;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
}

.topbar h2 {
  margin: 0 0 6px;
  font-size: 25px;
}

.topbar p {
  color: #bbb;
  margin: 0;
}

.back {
  border: 1px solid #555d70;
  background: #222938;
  color: white;
  padding: 11px 14px;
  border-radius: 10px;
  cursor: pointer;
}

/* PHOTO GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.tile {
  border: 0;
  padding: 0;
  background: #202635;
  border-radius: 14px;
  overflow: hidden;
  color: white;
  cursor: pointer;
  text-align: left;
}

.tile img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  display: block;
}

.tile span {
  display: block;
  padding: 12px;
}

/* FULL SCREEN VIEWER */
.viewer {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #000f;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.viewer.show {
  display: flex;
}

.viewer-inner {
  width: 100%;
  max-width: 1000px;
}

.viewer img,
.viewer video {
  max-width: 100%;
  max-height: 80vh;
  display: block;
  margin: auto;
}

.viewer-close {
  display: block;
  margin: 0 0 12px auto;
  background: white;
  color: black;
  border: 0;
  border-radius: 20px;
  padding: 10px 16px;
  cursor: pointer;
}

/* MOBILE */
@media (max-width: 600px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .tile img {
    height: 160px;
  }

  .topbar h2 {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<!-- COVER PAGE -->
<section class="hero" id="home">

  <button class="cover" onclick="openGallery()">

    <img src="images%20(8).jpg" alt="Cover Image">

    <div class="cover-label">
      <h1>My Memories</h1>
      <p>Tap anywhere to explore photos and videos</p>
    </div>

  </button>

</section>


<!-- GALLERY PAGE -->
<section class="gallery" id="gallery">

  <div class="topbar">

    <div>
      <h2>My Photo & Video Gallery</h2>
      <p>Choose any photo or video</p>
    </div>

    <button class="back" onclick="goHome()">
      ← Back
    </button>

  </div>


  <div class="grid">

    <button class="tile" onclick="showImage('images%20(3).jpeg')">
      <img src="images%20(3).jpeg" alt="Photo 1">
      <span>Photo 1</span>
    </button>

    <button class="tile" onclick="showImage('images%20(4).jpeg')">
      <img src="images%20(4).jpeg" alt="Photo 2">
      <span>Photo 2</span>
    </button>

    <button class="tile" onclick="showImage('images%20(5).jpeg')">
      <img src="images%20(5).jpeg" alt="Photo 3">
      <span>Photo 3</span>
    </button>

    <button class="tile" onclick="showImage('images%20(6).jpeg')">
      <img src="images%20(6).jpeg" alt="Photo 4">
      <span>Photo 4</span>
    </button>

    <button class="tile" onclick="showImage('images%20(7).jpeg')">
      <img src="images%20(7).jpeg" alt="Photo 5">
      <span>Photo 5</span>
    </button>

    <button class="tile" onclick="showVideo('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4')">
      <img src="images%20(3).jpeg" alt="Video preview">
      <span>▶ Sample Video</span>
    </button>

  </div>

</section>


<!-- IMAGE / VIDEO VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer(event)">

  <div class="viewer-inner">

    <button class="viewer-close" onclick="closeViewer()">
      Close ✕
    </button>

    <div id="viewerContent"></div>

  </div>

</div>


<script>

let currentView = "home";

// OPEN GALLERY
function openGallery() {

  if (currentView !== "home") return;

  history.pushState({page: "gallery"}, "");

  document.getElementById("home").style.display = "none";
  document.getElementById("gallery").classList.add("show");

  currentView = "gallery";

  window.scrollTo(0, 0);
}


// BACK TO COVER
function goHome() {

  if (currentView === "viewer") {
    closeViewer();
  }

  document.getElementById("gallery").classList.remove("show");
  document.getElementById("home").style.display = "grid";

  currentView = "home";

  window.scrollTo(0, 0);
}


// OPEN PHOTO
function showImage(src) {

  history.pushState({page: "viewer"}, "");

  document.getElementById("viewerContent").innerHTML =
    '<img src="' + src + '" alt="Selected photo">';

  document.getElementById("viewer").classList.add("show");

  currentView = "viewer";
}


// OPEN VIDEO
function showVideo(src) {

  history.pushState({page: "viewer"}, "");

  document.getElementById("viewerContent").innerHTML =
    '<video src="' + src + '" controls autoplay playsinline></video>';

  document.getElementById("viewer").classList.add("show");

  currentView = "viewer";
}


// CLOSE PHOTO / VIDEO
function closeViewer(event) {

  const viewer = document.getElementById("viewer");

  if (event && event.target !== viewer) {
    return;
  }

  if (currentView !== "viewer") return;

  history.back();
}


// ANDROID PHONE BACK BUTTON
window.addEventListener("popstate", function() {

  if (currentView === "viewer") {

    const video = document.querySelector("#viewerContent video");

    if (video) video.pause();

    document.getElementById("viewer").classList.remove("show");
    document.getElementById("viewerContent").innerHTML = "";

    currentView = "gallery";

  } else if (currentView === "gallery") {

    document.getElementById("gallery").classList.remove("show");
    document.getElementById("home").style.display = "grid";

    currentView = "home";

    window.scrollTo(0, 0);
  }

});

</script>

</body>
</html>
