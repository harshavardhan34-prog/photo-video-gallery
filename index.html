<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo & Video Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #10131b; color: #fff; }
    .hero { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    .cover { width: min(900px, 100%); border: 0; padding: 0; border-radius: 22px; overflow: hidden;
      background: #222; color: white; cursor: pointer; position: relative; box-shadow: 0 18px 60px #0008; }
    .cover img { display: block; width: 100%; height: min(62vh, 520px); object-fit: cover; }
    .cover-label { position: absolute; inset: auto 0 0; padding: 54px 20px 24px;
      background: linear-gradient(transparent, #000d); text-align: left; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 46px); }
    p { color: #d4d7df; margin: 0; }
    .hint { margin-top: 18px; color: #aeb6c8; }
    .gallery { display: none; padding: 28px 18px 50px; max-width: 1100px; margin: auto; }
    .gallery.show { display: block; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
    .topbar h2 { margin: 0; font-size: 28px; }
    .back { border: 1px solid #555d70; background: #222938; color: white; padding: 10px 15px;
      border-radius: 10px; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .tile { border: 0; padding: 0; background: #202635; border-radius: 14px; overflow: hidden;
      color: white; cursor: pointer; text-align: left; }
    .tile img, .tile video { width: 100%; height: 210px; object-fit: cover; display: block; background: #000; }
    .tile span { display: block; padding: 12px; }
    .viewer { display: none; position: fixed; inset: 0; z-index: 5; background: #000e;
      align-items: center; justify-content: center; padding: 18px; }
    .viewer.show { display: flex; }
    .viewer-inner { width: min(1000px, 100%); }
    .viewer img, .viewer video { max-width: 100%; max-height: 78vh; display: block; margin: auto; }
    .viewer-close { display: block; margin: 0 0 12px auto; background: #fff; color: #111;
      border: 0; border-radius: 20px; padding: 9px 14px; cursor: pointer; }
    @media (max-width: 600px) { .cover img { height: 55vh; } .topbar h2 { font-size: 22px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero" id="home">
      <div>
        <button class="cover" onclick="openGallery()" aria-label="Open photo and video gallery">
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=1400&q=85" alt="Gallery cover">
          <div class="cover-label">
            <h1>My Memories</h1>
            <p>Tap this picture to explore photos and videos</p>
          </div>
        </button>
        <div class="hint">Tap the image to open the gallery ↓</div>
      </div>
    </section>

    <section class="gallery" id="gallery">
      <div class="topbar">
        <div><h2>Photo & Video Gallery</h2><p>Choose any item to view it.</p></div>
        <button class="back" onclick="goHome()">← Back</button>
      </div>
      <div class="grid">
        <button class="tile" onclick="showImage('https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=1400&q=85')">
          <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=700&q=80" alt="Sunrise landscape"><span>Photo 1</span>
        </button>
        <button class="tile" onclick="showImage('https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1400&q=85')">
          <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=700&q=80" alt="Mountain lake"><span>Photo 2</span>
        </button>
        <button class="tile" onclick="showImage('https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1400&q=85')">
          <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=700&q=80" alt="Ocean waves"><span>Photo 3</span>
        </button>
        <button class="tile" onclick="showVideo('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4')">
          <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=700&q=80" alt="Flowers video preview"><span>▶ Sample video</span>
        </button>
      </div>
    </section>
  </main>

  <div class="viewer" id="viewer" onclick="closeViewer(event)">
    <div class="viewer-inner">
      <button class="viewer-close" onclick="closeViewer()">Close ✕</button>
      <div id="viewerContent"></div>
    </div>
  </div>

  <script>
    function openGallery() {
      document.getElementById('home').style.display = 'none';
      document.getElementById('gallery').classList.add('show');
      window.scrollTo(0, 0);
    }
    function goHome() {
      document.getElementById('gallery').classList.remove('show');
      document.getElementById('home').style.display = 'grid';
      window.scrollTo(0, 0);
    }
    function showImage(src) {
      document.getElementById('viewerContent').innerHTML =
        '<img src="' + src + '" alt="Selected photo">';
      document.getElementById('viewer').classList.add('show');
    }
    function showVideo(src) {
      document.getElementById('viewerContent').innerHTML =
        '<video src="' + src + '" controls autoplay playsinline></video>';
      document.getElementById('viewer').classList.add('show');
    }
    function closeViewer(event) {
      if (event && event.target !== document.getElementById('viewer')) return;
      const video = document.querySelector('#viewerContent video');
      if (video) video.pause();
      document.getElementById('viewer').classList.remove('show');
      document.getElementById('viewerContent').innerHTML = '';
    }
  </script>
</body>
</html>
