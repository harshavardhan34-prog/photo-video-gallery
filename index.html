
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo & Video Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131b;
      color: #fff;
    }

    .hero {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }

    .cover {
      width: min(900px, 100%);
      border: 0;
      padding: 0;
      border-radius: 22px;
      overflow: hidden;
      background: #222;
      color: white;
      cursor: pointer;
      position: relative;
      box-shadow: 0 18px 60px #0008;
    }

    .cover img {
      display: block;
      width: 100%;
      height: min(62vh, 520px);
      object-fit: cover;
    }

    .cover-label {
      position: absolute;
      inset: auto 0 0;
      padding: 54px 20px 24px;
      background: linear-gradient(transparent, #000d);
      text-align: left;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 46px);
    }

    p {
      color: #d4d7df;
      margin: 0;
    }

    .hint {
      margin-top: 18px;
      color: #aeb6c8;
    }

    .gallery {
      display: none;
      padding: 28px 18px 50px;
      max-width: 1100px;
      margin: auto;
    }

    .gallery.show {
      display: block;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .topbar h2 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      border: 1px solid #555d70;
      background: #222938;
      color: white;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .back:hover {
      background: #39445a;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .tile {
      border: 0;
      padding: 0;
      background: #202635;
      border-radius: 14px;
      overflow: hidden;
      color: white;
      cursor: pointer;
      text-align: left;
    }

    .tile img,
    .tile video {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .tile span {
      display: block;
      padding: 12px;
    }

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000e;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .viewer.show {
      display: flex;
    }

    .viewer-inner {
      width: min(1000px, 100%);
    }

    .viewer img,
    .viewer video {
      max-width: 100%;
      max-height: 78vh;
      display: block;
      margin: auto;
    }

    .viewer-close {
      display: block;
      margin: 0 0 12px auto;
      background: #fff;
      color: #111;
      border: 0;
      border-radius: 20px;
      padding: 9px 14px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .cover img {
        height: 55vh;
      }

      .topbar h2 {
        font-size: 20px;
      }

      .grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .tile img {
        height: 160px;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- COVER PHOTO -->
  <section class="hero" id="home">
    <div>

      <button class="cover" onclick="openGallery()"
        aria-label="Open photo and video gallery">

        <img src="images%20(3).jpeg" alt="Gallery cover">

        <div class="cover-label">
          <h1>My Memories</h1>
          <p>Tap this picture to explore photos and videos</p>
        </div>

      </button>

      <div class="hint">
        Tap the image to open the gallery ↓
      </div>

    </div>
  </section>


  <!-- PHOTO GALLERY -->
  <section class="gallery" id="gallery">

    <div class="topbar">

      <div>
        <h2>Photo & Video Gallery</h2>
        <p>Choose any item to view it.</p>
      </div>

      <button class="back" onclick="goHome()">
        ← Back to Cover
      </button>

    </div>


    <div class="grid">

      <!-- PHOTO 1 -->
      <button class="tile"
        onclick="showImage('images%20(3).jpeg')">

        <img src="images%20(3).jpeg" alt="Photo 1">
        <span>Photo 1</span>

      </button>


      <!-- PHOTO 2 -->
      <button class="tile"
        onclick="showImage('images%20(4).jpeg')">

        <img src="images%20(4).jpeg" alt="Photo 2">
        <span>Photo 2</span>

      </button>


      <!-- PHOTO 3 -->
      <button class="tile"
        onclick="showImage('images%20(5).jpeg')">

        <img src="images%20(5).jpeg" alt="Photo 3">
        <span>Photo 3</span>

      </button>


      <!-- PHOTO 4 -->
      <button class="tile"
        onclick="showImage('images%20(6).jpeg')">

        <img src="images%20(6).jpeg" alt="Photo 4">
        <span>Photo 4</span>

      </button>


      <!-- PHOTO 5 -->
      <button class="tile"
        onclick="showImage('images%20(7).jpeg')">

        <img src="images%20(7).jpeg" alt="Photo 5">
        <span>Photo 5</span>

      </button>


      <!-- SAMPLE VIDEO -->
      <button class="tile"
        onclick="showVideo('https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4')">

        <img src="images%20(3).jpeg" alt="Video preview">
        <span>▶ Sample video</span>

      </button>

    </div>

  </section>

</main>


<!-- FULL SCREEN IMAGE / VIDEO VIEWER -->
<div class="viewer" id="viewer" onclick="closeViewer(event)">

  <div class="viewer-inner">

    <button class="viewer-close" onclick="closeViewer()">
      Close ✕
    </button>

    <div id="viewerContent"></div>

  </div>

</div>


<script>

  // OPEN GALLERY
  function openGallery() {

    document.getElementById('home').style.display = 'none';

    document.getElementById('gallery').classList.add('show');

    if (history.state?.page !== 'gallery') {
      history.pushState({ page: 'gallery' }, '');
    }

    window.scrollTo(0, 0);
  }


  // GO BACK TO COVER
  function goHome() {

    closeViewer();

    document.getElementById('gallery').classList.remove('show');

    document.getElementById('home').style.display = 'grid';

    window.scrollTo(0, 0);
  }


  // OPEN FULL IMAGE
  function showImage(src) {

    document.getElementById('viewerContent').innerHTML =
      '<img src="' + src + '" alt="Selected photo">';

    document.getElementById('viewer').classList.add('show');

    history.pushState({ page: 'viewer' }, '');
  }


  // PLAY VIDEO
  function showVideo(src) {

    document.getElementById('viewerContent').innerHTML =
      '<video src="' + src + '" controls autoplay playsinline></video>';

    document.getElementById('viewer').classList.add('show');

    history.pushState({ page: 'viewer' }, '');
  }


  // CLOSE IMAGE OR VIDEO
  function closeViewer(event) {

    if (event && event.target !== document.getElementById('viewer')) {
      return;
    }

    const video = document.querySelector('#viewerContent video');

    if (video) {
      video.pause();
    }

    document.getElementById('viewer').classList.remove('show');

    document.getElementById('viewerContent').innerHTML = '';
  }


  // ANDROID PHONE BACK BUTTON
  window.addEventListener('popstate', function() {

    if (document.getElementById('viewer').classList.contains('show')) {

      closeViewer();

    } else if (document.getElementById('gallery').classList.contains('show')) {

      goHome();

    }

  });

</script>

</body>
</html>
