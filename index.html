
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10101c">

  <title>My Photo Gallery</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #10101c;
      color: white;
    }

    header {
      padding: 25px 15px;
      text-align: center;
      background: linear-gradient(135deg, #25254a, #11111d);
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #c4c4d8;
      font-size: 14px;
    }

    .hero {
      padding: 25px 15px;
      text-align: center;
    }

    .hero img {
      width: 100%;
      max-width: 850px;
      height: 350px;
      object-fit: cover;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }

    .hero h2 {
      margin-top: 18px;
      font-size: 23px;
    }

    .hero p {
      color: #b8b8c8;
      margin-top: 8px;
    }

    .gallery-title {
      text-align: center;
      padding: 25px 10px 15px;
    }

    .gallery-title h2 {
      font-size: 24px;
    }

    .gallery-title p {
      color: #aaa;
      margin-top: 8px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .photo-card {
      overflow: hidden;
      border-radius: 14px;
      background: #202033;
    }

    .photo-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .photo-card img:hover {
      transform: scale(1.05);
    }

    .video-section {
      text-align: center;
      padding: 35px 15px;
      margin-top: 20px;
      background: #191927;
    }

    .video-section h2 {
      margin-bottom: 10px;
    }

    .video-section p {
      color: #aaa;
    }

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .viewer img {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 22px;
      font-size: 40px;
      cursor: pointer;
      color: white;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #aaa;
      background: #0a0a12;
      font-size: 14px;
    }

    @media (min-width: 700px) {
      .gallery {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero img {
        height: 450px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📸 My Photo Gallery</h1>
    <p>Beautiful Memories • Special Moments</p>
  </header>

  <!-- COVER PHOTO -->
  <section class="hero">
    <img
      src="images%20(3).jpeg"
      alt="Cover Photo"
      onclick="openGallery()"
    >

    <h2>Welcome to My Gallery ❤️</h2>
    <p>Click the cover photo to explore more memories</p>
  </section>

  <!-- PHOTO GALLERY -->
  <section id="gallerySection">

    <div class="gallery-title">
      <h2>My Photos</h2>
      <p>Every picture tells a story</p>
    </div>

    <div class="gallery">

      <div class="photo-card">
        <img src="images%20(3).jpeg"
             alt="Photo 1"
             onclick="openImage(this.src)">
      </div>

      <div class="photo-card">
        <img src="images%20(4).jpeg"
             alt="Photo 2"
             onclick="openImage(this.src)">
      </div>

      <div class="photo-card">
        <img src="images%20(5).jpeg"
             alt="Photo 3"
             onclick="openImage(this.src)">
      </div>

      <div class="photo-card">
        <img src="images%20(6).jpeg"
             alt="Photo 4"
             onclick="openImage(this.src)">
      </div>

      <div class="photo-card">
        <img src="images%20(7).jpeg"
             alt="Photo 5"
             onclick="openImage(this.src)">
      </div>

    </div>
  </section>

  <!-- VIDEO SECTION -->
  <section class="video-section">
    <h2>🎬 Video Gallery</h2>
    <p>More memories coming soon!</p>
  </section>

  <!-- FULL SCREEN PHOTO -->
  <div class="viewer" id="viewer" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="largeImage" src="" alt="Full size photo">
  </div>

  <footer>
    <p>© 2026 My Photo Gallery | All Rights Reserved</p>
  </footer>

  <script>
    function openGallery() {
      document.getElementById("gallerySection")
        .scrollIntoView({ behavior: "smooth" });
    }

    function openImage(source) {
      document.getElementById("largeImage").src = source;
      document.getElementById("viewer").style.display = "flex";
    }

    function closeImage() {
      document.getElementById("viewer").style.display = "none";
    }
  </script>

</body>
</html>
