
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #10121c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin: 15px 0 25px;
}

.cover-container {
    max-width: 600px;
    margin: auto;
}

.cover {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: 0 5px 20px #000;
}

.cover-text {
    margin-top: 12px;
    color: #ddd;
    font-size: 16px;
}

#gallery {
    display: none;
    margin: 35px auto;
    max-width: 1000px;
}

#gallery h2 {
    margin-bottom: 20px;
}

.photos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.photos img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
}

#viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

#viewer img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
}

.close {
    position: absolute;
    top: 15px;
    right: 22px;
    font-size: 35px;
    cursor: pointer;
}

@media (min-width: 700px) {
    .photos {
        grid-template-columns: repeat(3, 1fr);
    }

    .photos img {
        height: 230px;
    }
}
</style>
</head>

<body>

<h1>My Photo & Video Gallery</h1>

<div class="cover-container">
    <img
        class="cover"
        src="images%20(3).jpeg"
        alt="Cover Photo"
        onclick="showGallery()"
    >

    <div class="cover-text">
        Click the cover photo to view all photos ❤️
    </div>
</div>

<section id="gallery">
    <h2>My Photos</h2>

    <div class="photos">
        <img src="images%20(3).jpeg" onclick="openImage(this.src)" alt="Photo 1">
        <img src="images%20(4).jpeg" onclick="openImage(this.src)" alt="Photo 2">
        <img src="images%20(5).jpeg" onclick="openImage(this.src)" alt="Photo 3">
        <img src="images%20(6).jpeg" onclick="openImage(this.src)" alt="Photo 4">
        <img src="images%20(7).jpeg" onclick="openImage(this.src)" alt="Photo 5">
    </div>
</section>

<div id="viewer" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="fullImage" alt="Full-size photo">
</div>

<script>
function showGallery() {
    const gallery = document.getElementById("gallery");

    gallery.style.display = "block";

    gallery.scrollIntoView({
        behavior: "smooth",
        block: "start"
    });
}

function openImage(src) {
    document.getElementById("fullImage").src = src;
    document.getElementById("viewer").style.display = "flex";
}

function closeImage() {
    document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html>
