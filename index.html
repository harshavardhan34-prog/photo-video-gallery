
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Photo & Video Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px;
      background: #222;
    }

    h1 {
      margin: 0;
      font-size: 26px;
    }

    .cover {
      padding: 20px;
    }

    .cover img {
      width: 100%;
      max-width: 650px;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 15px;
    }

    .gallery img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 10px;
      cursor: pointer;
    }

    .video-section {
      padding: 20px;
      color: #ccc;
    }

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .viewer img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }

    .close {
      position: absolute;
      top: 15px;
      right: 22px;
      font-size: 38px;
      cursor: pointer;
    }

    footer {
      padding: 20px;
      background: #222;
      color: #aaa;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Photo & Video Gallery</h1>
    <p>Click the cover image to see more photos</p>
  </header>

  <!-- COVER IMAGE -->
  <section class="cover">
    <img
      src="Screenshot_20261103_122849.jpg/Screenshot_20261103_122849.jpg"
      alt="Cover photo"
      onclick="openGallery()"
    >
    <p>Tap the image to explore more photos ❤️</p>
  </section>

  <!-- PHOTO GALLERY -->
  <section id="gallerySection" style="display: none;">
    <h2>My Photo Gallery</h2>

    <div class="gallery">
      <img src="images%20(3).jpeg" alt="Photo 1" onclick="openImage(this.src)">
      <img src="images%20(4).jpeg" alt="Photo 2" onclick="openImage(this.src)">
      <img src="images%20(5).jpeg" alt="Photo 3" onclick="openImage(this.src)">
      <img src="images%20(6).jpeg" alt="Photo 4" onclick="openImage(this.src)">
      <img src="images%20(7).jpeg" alt="Photo 5" onclick="openImage(this.src)">
    </div>
  </section>

  <!-- VIDEO GALLERY -->
  <section class="video-section">
    <h2>Video Gallery</h2>
    <p>Videos will appear here when you add video files.</p>
  </section>

  <!-- FULL SCREEN IMAGE -->
  <div class="viewer" id="viewer" onclick="closeImage()">
    <span class="close">&times;</span>
    <img id="largeImage" src="" alt="Full size photo">
  </div>

  <footer>
    <p>© 2026 My Gallery</p>
  </footer>

  <script>
    function openGallery() {
      const gallery = document.getElementById("gallerySection");
      gallery.style.display = "block";
      gallery.scrollIntoView({ behavior: "smooth" });
    }

    function openImage(imageSource) {
      document.getElementById("largeImage").src = imageSource;
      document.getElementById("viewer").style.display = "flex";
    }

    function closeImage() {
      document.getElementById("viewer").style.display = "none";
    }
  </script>

</body>
</html>
